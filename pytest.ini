[pytest]
# Set project root for correct imports from src/
pythonpath = .

# Specify directory to search for test files
testpaths = tests

# Naming pattern for test files
python_files = test_*.py

# Default execution flags: -v (verbose output), --tb=short (concise error traceback)
addopts = -v --tb=short

# Register custom markers (prevents Pytest warnings)
markers =
    xfail: mark test as expected to fail due to known SUT defect
    functional: tests for basic functional correctness
    eval: tests for RAG metrics (Recall, Faithfulness, Similarity)
    redteam: tests for prompt injection and adversarial attacks